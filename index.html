<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ROTA" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon.png" />
  <title>ROTA</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      color: #0f2340;
      overflow-x: hidden;
    }

    .phone {
      width: 100%;
      min-height: 100vh;
      margin: 0 auto;
      background: #ffffff;
      position: relative;
      overflow: hidden;
    }

    .status-bar {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px 0 14px;
      color: #5e6268;
      font-size: 10px;
      line-height: 1;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 400;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #646970;
      font-size: 8px;
    }

    .battery {
      width: 7px;
      height: 12px;
      border: 1px solid #6a6a6a;
      border-radius: 2px;
      position: relative;
    }

    .battery::after {
      content: "";
      position: absolute;
      top: -3px;
      left: 2px;
      width: 3px;
      height: 1px;
      background: #6a6a6a;
    }

    .battery-level {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 18%;
      background: #d74732;
    }

    .header {
      height: 67px;
      border-bottom: 1px solid #edf0f3;
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 17px;
    }

    .back {
      width: 15px;
      height: 15px;
      border-left: 2px solid #25364c;
      border-bottom: 2px solid #25364c;
      transform: rotate(45deg);
      margin-left: 2px;
      flex: 0 0 auto;
    }

    .header-title {
      font-size: 19px;
      font-weight: 700;
      color: #2d3440;
      letter-spacing: -0.4px;
      white-space: nowrap;
    }

    .content {
      padding: 21px 18px 0;
    }

    .turno-title {
      font-size: 25px;
      font-weight: 400;
      color: #10284b;
      letter-spacing: -0.9px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .date-accepted-row {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .timestamp {
      color: #9ca7b6;
      font-size: 17px;
      font-weight: 400;
      letter-spacing: -0.3px;
    }

    .accepted {
      background: #e9f9ef;
      color: #31bb6b;
      font-weight: 700;
      font-size: 14px;
      border-radius: 4px;
      padding: 5px 6px 4px;
      line-height: 1;
    }

    .called {
      margin-top: 34px;
      color: #647185;
      font-size: 18px;
      line-height: 1.22;
      letter-spacing: -0.4px;
      font-weight: 400;
    }

    .notice-box {
      margin-top: 20px;
      background: #f6f8fb;
      border-radius: 6px;
      padding: 15px 10px;
      color: #526074;
      font-size: 16px;
      line-height: 1.3;
      letter-spacing: -0.3px;
      font-weight: 400;
    }

    .notice-box .red {
      color: #f14938;
      font-size: 19px;
      font-weight: 400;
    }

    .details {
      margin-top: 25px;
      width: 100%;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      min-height: 35px;
      column-gap: 20px;
    }

    .label {
      font-size: 16px;
      color: #667386;
      letter-spacing: -0.3px;
      font-weight: 400;
    }

    .value {
      font-size: 16px;
      color: #15223a;
      letter-spacing: -0.3px;
      font-weight: 400;
      text-align: right;
      min-width: 80px;
    }

    #regionValue {
      border: none;
      outline: none;
      background: transparent;
      font: inherit;
      color: inherit;
      width: 48px;
      text-align: right;
      padding: 0;
      cursor: default;
      user-select: none;
      caret-color: transparent;
    }

    #regionValue.editing {
      user-select: text;
      caret-color: auto;
      cursor: text;
    }
  </style>
</head>
<body>
  <main class="phone">
    <div class="status-bar">
      <div class="status-left">
        <span>21:30</span>
        <span>▣</span>
        <span>∞</span>
        <span style="width:10px;height:10px;border-radius:3px;background:#666;display:inline-block"></span>
      </div>
      <div class="status-icons">
        <span>⌖</span>
        <span>Vo<br><b>LTE</b></span>
        <span>▾</span>
        <span>◆</span>
        <span>5G</span>
        <span>◢</span>
        <div class="battery"><div class="battery-level"></div></div>
      </div>
    </div>

    <header class="header">
      <div class="back"></div>
      <div class="header-title">Detalhe da notificação</div>
    </header>

    <section class="content">
      <div class="turno-title">Turno:<span id="todayTitle"></span> 13:50 - 13:50</div>

      <div class="date-accepted-row">
        <div class="timestamp"><span id="todayTimestamp"></span> 10:12</div>
        <div class="accepted">Aceito</div>
      </div>

      <div class="called">Você foi chamado para um próximo turno.</div>

      <div class="notice-box">
        Por favor, chegue ao hub às <span class="red" id="noticeDate"></span> <span class="red">13:50</span> para começar a tarefa de hoje.
      </div>

      <div class="details">
        <div class="detail-row">
          <div class="label">Chamada do Hub</div>
          <div class="value">OF Hub_SP_Lapa</div>
        </div>
        <div class="detail-row">
          <div class="label">Data do Turno</div>
          <div class="value" id="shiftDate"></div>
        </div>
        <div class="detail-row">
          <div class="label">Horário do Turno</div>
          <div class="value">13:50-13:50</div>
        </div>
        <div class="detail-row">
          <div class="label">Nome da região</div>
          <div class="value"><input id="regionValue" value="S-2" readonly /></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function setToday() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = pad(now.getMonth() + 1);
      const dd = pad(now.getDate());
      const iso = `${yyyy}-${mm}-${dd}`;
      const br = `${dd}/${mm}`;

      document.getElementById("todayTitle").textContent = iso;
      document.getElementById("todayTimestamp").textContent = iso;
      document.getElementById("shiftDate").textContent = iso;
      document.getElementById("noticeDate").textContent = br;
    }

    const regionInput = document.getElementById("regionValue");

    regionInput.addEventListener("dblclick", () => {
      regionInput.readOnly = false;
      regionInput.classList.add("editing");
      regionInput.focus();
      regionInput.select();
    });

    function lockRegion() {
      regionInput.readOnly = true;
      regionInput.classList.remove("editing");
      regionInput.setSelectionRange(regionInput.value.length, regionInput.value.length);
      regionInput.blur();
    }

    regionInput.addEventListener("blur", lockRegion);
    regionInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === "Escape") lockRegion();
    });

    setToday();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
