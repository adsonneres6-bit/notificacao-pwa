<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ROTA" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="stylesheet" href="index.css">
  <title>ROTA</title>
</head>

<body>
  <main class="phone">
    </div>
    </div>

    <header class="header">
      <div class="back" onclick="openSPX()" aria-label="Abrir SPX Motorista Parceiro"></div>
      <div class="header-title">Detalhe da notificação</div>
    </header>

    <section class="content">
      <div class="turno-title"><span id="todayTitle"></span> <input class="timeEditable" id="timeTitleStart"
          value="13:50" readonly /> - <input class="timeEditable" id="timeTitleEnd" value="13:50" readonly />,</div>

      <div class="date-accepted-row">
        <div class="timestamp">
          <span id="todayTimestamp"></span>
          <span id="todayTime">21:07</span>
        </div>
        <div class="accepted">Aceito</div>
      </div>

      <div class="called">Your have accepted this route.</div>

      <div class="notice-box">
        Por favor, chegue ao hub às <span class="red" id="noticeDate"></span> <input class="timeEditable red"
          id="timeNotice" value="13:50" readonly /> para começar a tarefa de hoje.
      </div>

      <div class="detail-row">
    <div class="label">Chamada do Hub</div>

    <div class="value">
        <span id="hubText">OF Hub_SP_Lapa</span>

        <select id="hubSelect" style="display:none;">
            <option>OF Hub_SP_Lapa</option>
            <option>OF Hub_SP_Guarulhos</option>
            <option>OF Hub_SP_Vila Guilherme</option>
        </select>
    </div>
</div>

        <div class="detail-row">
          <div class="label">Nome da região</div>
          <div class="value"><input id="regionValue" value="S-4" readonly /></div>
        </div>

        <div class="detail-row">

          <div class="label">Data do Turno</div>
          <div class="value" id="shiftDate"></div>
        </div>
        <div class="detail-row">
          <div class="label">Horário do Turno</div>
          <div class="value"><input class="timeEditable" id="timeDetailStart" value="13:50" readonly /> - <input
              class="timeEditable" id="timeDetailEnd" value="13:50" readonly /></div>
        </div>

      </div>
    </section>
  </main>

  <script src="index.js"></script>
</body>

</html>
